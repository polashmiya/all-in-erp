<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="myErp — configurable ERP" />
    <title>myErp</title>
    <style>
      /* Shown until React mounts (replaced on first render). */
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f6fa; }
      .boot-splash::after { content: ""; width: 36px; height: 36px; border-radius: 50%; border: 3px solid #d6e4ff; border-top-color: #2f54eb; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) { .boot-splash { background: #0e1117; } .boot-splash::after { border-color: #1d2b53; border-top-color: #597ef7; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash" role="progressbar" aria-label="Loading"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
