<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B8478" />
    <meta name="description" content="myErp Panel — configure accounts, business units and screens" />
    <title>myErp Panel</title>
    <style>
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f3f8f7; }
      .boot-splash::after { content: ""; width: 36px; height: 36px; border-radius: 50%; border: 3px solid #cfe8e4; border-top-color: #0b8478; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) { .boot-splash { background: #0b1112; } .boot-splash::after { border-color: #12352f; border-top-color: #2ba89a; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash" role="progressbar" aria-label="Loading"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
